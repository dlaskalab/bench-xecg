# training loop hyp
wandb_log: true
wandb_group: best_agegender_xlstm_ft
epochs: 30
wd: 0.1
batch_size: 256

lr_head: 0.001
lr_core: 0.00001
drop_path_prob: 0.5
layerwise_lr_decay: 0.75 # 0.75

linear_probing: false
deterministic: false
compile_model: false

embedding_size: 1024
encoder_type: vanilla
xlstm_config: ["s","s","m","m","s","s","m","m","s"]
