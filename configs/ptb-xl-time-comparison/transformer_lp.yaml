# training loop hyp
wandb_log: true
wandb_group: time_trans_lp
epochs: 30
wd: 0.1
batch_size: 96
patience: 30

lr_head: 0.001
lr_core: 0.0001
drop_path_prob: 0.5
layerwise_lr_decay: 0.75 # 0.75

linear_probing: true
deterministic: false

embedding_size: 768
encoder_type: transformer
checkpoint: pretrained_models/transformer.ckpt

use_final_layer_norm: false
cls_normalization: batch  # 'batch', 'layer', 'instance'

data_folder_ptbxl: /scratch/datasets/ptb-xl/raw/1.0.3/records500/


training_pct: 1.
