# training loop hyp
wandb_log: true
wandb_group: best_trans_ft
epochs: 50
wd: 0.1
batch_size: 256

lr_head: 0.001
lr_core: 0.00001
drop_path_prob: 0.
layerwise_lr_decay: 0.75 

linear_probing: false
deterministic: false

embedding_size: 768
encoder_type: transformer
checkpoint: pretrained_models/transformer.ckpt

use_final_layer_norm: false
cls_normalization: batch  # 'batch', 'layer', 'instance'

data_folder_cpsc2018: /home/datasets/CPSC2018/


training_pct: 1.

max_length_signal: 1000